<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <!--? cabeça: informações do site/arquivo.html que não aparecem, aqui fica coisas importantes como configurações ""em outras palavras a cabeça/cerebro do site"" -->
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Início</title>
        <script type="module" src="script.js" defer></script> <!--? roda o script.js após todo o html ter rodado -->
    </head>
    <body> <!--? corpo: parte que se pode interagir e visualizar, ""em outras palavras o corpo do site""  -->
        <header> <!--? cabeçalio: conteudo que fica no topo do site -->
            <div class="header-container"><!--? div: como se fosse conteiners que dividem os elementos  -->

                    <span class="logo-text"> <!--? span: elemento de texto inline, não quebra linha sozinho -->

                        <span class="logo-subtitle">Tecmologia para todos</span>
                    </span>
                </a>
                <nav class="main-nav"> <!--? nav: tagsemantica para o menu de navegação -->
                    <a href="index.html" class="nav-link active">Início</a>
                    <a href="cursos.html" class="nav-link">Cursos</a>
                    <a href="sobre.html" class="nav-link">Sobre</a>
                    <a href="contato.html" class="nav-link">Contato</a>
                </nav>
            </div>
            <div class="header-actions">
                <!--* Agrupa os butões de busca CTA -->
                <div class="search-box">
                    <input type="text" placeholder="Buscar cursos..."> <!--? input: recebe dados -->
                    
                </div>
            </div>
        </header>
        <main> <!--? meu: conteudo principal do site -->

        </main>
        <footer><!--? rodapé: conteudo que fica no final do site como nome do profutor ou links estras -->

        </footer>

    </body>
</html>
